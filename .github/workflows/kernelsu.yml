name: Update KernelSU Submodule

on:
  workflow_dispatch:

jobs:
  update-submodule:
    runs-on: ubuntu-26.04
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: Remove Old Submodule Traces
        run: |
          git rm --cached KernelSU || true
          rm -rf .git/modules/KernelSU
          rm -rf KernelSU

      - name: Add and Update Submodule
        run: |
          git submodule add --force https://github.com/rifsxd/KernelSU-Next.git KernelSU
          git submodule update --init --recursive KernelSU

          cd KernelSU
          git fetch --all --tags
          LATEST_TAG=$(git tag -l "*legacy*" --sort=-v:refname | head -n 1)
          if [ -z "$LATEST_TAG" ]; then
            echo "::error::No legacy tag found in KernelSU repository"
            exit 1
          fi
          COMMIT_HASH=$(git rev-list -n 1 "$LATEST_TAG")
          git checkout "$COMMIT_HASH"
          cd ..

          git add KernelSU
          echo "COMMIT_MSG=chore: Update KernelSU submodule to tag $LATEST_TAG ($COMMIT_HASH)" >> $GITHUB_ENV

      - name: Commit and Push Changes
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: ${{ env.COMMIT_MSG }}
