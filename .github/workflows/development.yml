name: Development Build (Galaxy A50)

on:
  workflow_dispatch:
    inputs:
      ccache_behavior:
        description: 'ccache behavior'
        required: true
        default: 'disabled'
        type: choice
        options:
          - 'disabled'
          - 'success_only'
          - 'always'

jobs:
  build:
    runs-on: ubuntu-26.04

    strategy:
      fail-fast: true
      matrix:
        type:
          - oneui-11-e
          - oneui-12-e
          # - oneui-11-p
          # - oneui-12-p
          # - aosp-11-e
          # - aosp-12-e
          # - aosp-11-p
          # - aosp-12-p

    steps:
      - uses: actions/checkout@v7

      - uses: szenius/set-timezone@v2.0
        with:
          timezoneLinux: "Europe/Minsk"
          timezoneMacos: "Europe/Minsk"
          timezoneWindows: "Belarus Standard Time"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install bzip2 lib32stdc++6 libc6-dev-i386 libncurses6 jq -y

      - name: Install ccache
        if: inputs.ccache_behavior != 'disabled'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CCACHE_TAG=$(curl -s -H "Authorization: token $GITHUB_TOKEN" https://api.github.com/repos/ccache/ccache/releases/latest | jq -r .tag_name)
          CCACHE_VERSION="${CCACHE_TAG#v}"

          echo "Installing ccache version: $CCACHE_VERSION"

          wget -q "https://github.com/ccache/ccache/releases/download/${CCACHE_TAG}/ccache-${CCACHE_VERSION}-linux-x86_64-glibc.tar.xz"

          tar -xf "ccache-${CCACHE_VERSION}-linux-x86_64-glibc.tar.xz"
          sudo cp "ccache-${CCACHE_VERSION}-linux-x86_64-glibc/ccache" /usr/local/bin/ccache

          ccache --version
          rm -rf "ccache-${CCACHE_VERSION}-linux-x86_64-glibc"*

      - name: Parse build arguments
        run: |
          IFS='-' read -r VARIANT ANDROID SELINUX <<< "${{ matrix.type }}"
          echo "VARIANT=$VARIANT" >> $GITHUB_ENV
          echo "ANDROID=$ANDROID" >> $GITHUB_ENV
          echo "SELINUX=$SELINUX" >> $GITHUB_ENV

      - name: Restore ccache
        uses: actions/cache/restore@v5
        if: inputs.ccache_behavior != 'disabled'
        with:
          path: .ccache
          key: ccache-${{ matrix.type }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ matrix.type }}-

      - name: Build Mint kernel (KernelSU)
        run: |
          set -eo pipefail
          echo "  I: Building Mint kernel ${GITHUB_REF##*/}-${GITHUB_RUN_NUMBER}"
          
          CCACHE_FLAG=""
          if [ "${{ inputs.ccache_behavior }}" != "disabled" ]; then
            CCACHE_FLAG="--ccache"
            echo "  I: ccache is enabled for this build."
          fi
          
          ./build.sh --automated --device a50 --variant $VARIANT --android $ANDROID -$SELINUX --kernelsu $CCACHE_FLAG

      - name: Upload kernel image artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.type }} Kernel Image (KernelSU)
          path: "out/boot.img"
          if-no-files-found: error

      - name: Prepare release package
        run: |
          mkdir -p ./release
          cp .config ./release/kernel_config_a50_$VARIANT-$ANDROID-$SELINUX.txt
          find ./out -iname "MintBeta-*.zip" -exec mv -f {} ./release/ \;

      - name: Upload release package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.type }} Release
          path: "release"
          if-no-files-found: error

      - name: Save ccache (Success only)
        uses: actions/cache/save@v5
        if: success() && inputs.ccache_behavior == 'success_only'
        with:
          path: .ccache
          key: ccache-${{ matrix.type }}-${{ github.run_id }}

      - name: Save ccache (Always)
        uses: actions/cache/save@v5
        if: always() && inputs.ccache_behavior == 'always'
        with:
          path: .ccache
          key: ccache-${{ matrix.type }}-${{ github.run_id }}

  release:
    name: Release files and configs
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v7

      - uses: szenius/set-timezone@v2.0
        with:
          timezoneLinux: "Europe/Minsk"
          timezoneMacos: "Europe/Minsk"
          timezoneWindows: "Belarus Standard Time"

      - name: Merge releases
        run: |
          set -eo pipefail
          gh run download "$GITHUB_RUN_ID" -p "*Release" --dir ./release
          find ./release -mindepth 2 -type f -exec mv {} ./release \;

      - name: Delete build configs and release directories
        run: |
          set -eo pipefail
          rm -f ./release/kernel_config_*.txt
          rm -rf ./release/aosp-* ./release/oneui-*

      - name: Delete older release
        uses: dev-drprasad/delete-older-releases@v0.3.4
        with:
          keep_latest: 12
          delete_tag_pattern: "xbeta"

      - name: Upload release
        uses: Hs1r1us/Release-AIO@v2.0.0
        with:
          tag_name: xbeta-${{ github.run_number }}_a50dx
          prerelease: true
          release_name: Galaxy A50 (beta-${{ github.run_number }})
          body_path: "./tools/make/release/a50-development.md"
          asset_files: "./release"
